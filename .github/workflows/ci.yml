name: 🔄️ CI

# Point d'entrée de la CI : .NET → Angular → CodeQL.
# Chaque étape ne part que si la précédente a réussi.
on:
  push:
    branches: [ "master", "dev" ]
  pull_request:
    branches: [ "master", "dev" ]

permissions:
  contents: read

# Une PR mise à jour (ex. rebase par Dependabot) annule le run précédent au lieu de s'empiler.
# Les pushes sur master/dev ne sont jamais annulés.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dotnet:
    uses: ./.github/workflows/dotnet.yml

  node:
    needs: dotnet
    uses: ./.github/workflows/node.js.yml

  codeql:
    needs: node
    # Une montée de version ne touche pas notre code : CodeQL repassera au push sur dev
    if: github.actor != 'dependabot[bot]'
    uses: ./.github/workflows/codeql.yml
    # Un workflow appelé ne peut pas obtenir plus de droits que le job qui l'appelle
    permissions:
      actions: read
      contents: read
      security-events: write
