# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "master" , "dev" ]
  pull_request:
    branches: [ "master" , "dev" ]

jobs:
  build:

    runs-on: self-hosted

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore source/TURO/TUROAPI/TUROAPI.slnx
    - name: Build
      run: dotnet build source/TURO/TUROAPI/TUROAPI.slnx --no-restore -c Release
    - name: Test
      run: dotnet test source/TURO/TUROAPI/TUROAPI.slnx --no-build -c Release --verbosity normal
