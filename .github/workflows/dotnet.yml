# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: 🔄️ .NET CI

on:
  push:
    branches: [ "master" , "dev" ]
  pull_request:
    branches: [ "master" , "dev" ]

jobs:
  build:
    name: CI .NET
    runs-on: self-hosted

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tableup_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4
    - name: ➡️ Setup .NET
      uses: actions/setup-dotnet@v4
      env:
        DOTNET_INSTALL_DIR: ${{ runner.temp }}/.dotnet
      with:
        dotnet-version: 10.0.x
    - name: 🏗️ Restore dependencies
      run: dotnet restore source/TURO/TUROAPI/TUROAPI.slnx
    - name: ⚙️ Build
      run: dotnet build source/TURO/TUROAPI/TUROAPI.slnx --no-restore -c Release
    - name: 📝 Test
      run: dotnet test source/TURO/TUROAPI/TUROAPI.slnx --no-build -c Release --verbosity normal

  node:
    needs: build
    if: always()
    uses: ./.github/workflows/node.js.yml
