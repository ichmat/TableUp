# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: 🔄️ .NET CI

# Lancé uniquement par ci.yml (job « dotnet »), première étape de la CI
on:
  workflow_call:

jobs:
  build:
    name: CI .NET
    runs-on: self-hosted
    # Pas de service Postgres ici : les tests créent leur propre base jetable via Testcontainers,
    # sur le Docker de la VM (socket monté dans le runner)

    steps:
    - uses: actions/checkout@v4
    - name: ➡️ Setup .NET
      uses: actions/setup-dotnet@v6
      env:
        DOTNET_INSTALL_DIR: ${{ runner.temp }}/.dotnet
      with:
        dotnet-version: 10.0.x
    - name: 🏗️ Restore dependencies
      run: dotnet restore source/TURO/TUROAPI/TUROAPI.slnx
    - name: ⚙️ Build
      run: dotnet build source/TURO/TUROAPI/TUROAPI.slnx --no-restore -c Release
    - name: 🐳 Check Docker access
      # Échoue tout de suite, avec un message clair, si le runner ne peut pas joindre le Docker de la VM
      run: |
        id
        ls -ln /var/run/docker.sock
        docker info --format 'Docker {{.ServerVersion}}'
    - name: 📝 Test
      run: dotnet test source/TURO/TUROAPI/TUROAPI.slnx --no-build -c Release --verbosity normal
