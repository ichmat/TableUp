version: 2
updates:
  - package-ecosystem: "nuget"
    directories:
      - "/source/TURO/TUROAPI/TUROAPI"
      - "/source/TURO/TUROAPI/TUROAPI.Test"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    groups:
      dotnet:
        patterns: ["Microsoft.*", "Npgsql*"]

  - package-ecosystem: "npm"
    directory: "/source/TURO/TUROApp"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    groups:
      angular:
        patterns: ["@angular/*", "@angular-devkit/*", "typescript", "zone.js"]

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/source/TURO"
    target-branch: "dev"
    schedule:
      interval: "weekly"