<div class="h-full w-full bg-surface flex flex-col items-center justify-center gap-4">

    <app-button text="test"></app-button>
    <app-input [(value)]="inputVal"[icon]="user" [iconClickable]="true"></app-input>
    <p> {{ inputVal }}</p>
    <app-time-input [(value)]="timeValue"></app-time-input>
    
    <p>{{ timeValue }}</p>

    <app-date-input [(dateValue)]="dateValue"></app-date-input>

    <p>{{ dateValue?.toLocaleDateString() }} </p>

    <app-number-input [(value)]="numberValue"></app-number-input>

    <p>{{ numberValue }} </p>

</div>
