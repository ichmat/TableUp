<div class="h-full w-full flex flex-col justify-center items-center">

    <img src="/assets/TableUp.png" class="h-24 mb-6" />

    <form [formRoot]="loginForm" class="w-72 bg-surface shadow-2xl rounded-xl
        flex flex-col p-4 gap-4">
        <h1 class="text-2xl text-center">Connexion</h1>
        <hr class="border-text-muted">

        @if(loginForm().touched() && loginForm().invalid() && submitAttempted()){
            <div class="bg-red-500/25 border-l-4 border-red-500 w-full p-2 text-red-800">
                @for (error of loginForm().errorSummary(); track $index) {
                    <p>- {{ error.message }}</p>
                }
            </div>
        }

        <app-input autocomplete="username" [formField]="loginForm.login" [icon]="userIcon" inputClass="w-full" placeholder="login / email" />
        <app-input autocomplete="current-password" [formField]="loginForm.password" [icon]="passwordIcon" inputClass="w-full" placeholder="mot de passe" type="password" />
    
        <app-button buttonClass="w-full" text="Valider" typeButton="submit" [disabled]="loginForm().submitting()" />
    </form>

</div>
