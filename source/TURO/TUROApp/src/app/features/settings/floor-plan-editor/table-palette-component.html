<div class="flex flex-col gap-1">
    <p class="font-black text-text-muted text-xs m-1">TABLES</p>
    @for (entry of entries(); track $index) {
        <button type="button" (pointerdown)="onPointerDown(entry, $event)"
            class="flex flex-row items-center gap-2 rounded-lg px-2 py-2 text-left cursor-grab touch-none hover:bg-app">
            <span class="inline-block border-2 border-slate bg-app shrink-0"
                [class.rounded-full]="entry.shape === 'Round'"
                [class.rounded-sm]="entry.shape !== 'Round'"
                [style.width.px]="entry.shape === 'Rectangular' ? 26 : 16"
                [style.height.px]="entry.shape === 'Rectangular' ? 12 : 16"></span>
            <span class="flex flex-col leading-tight">
                <span class="font-bold text-sm">{{ label(entry) }}</span>
                <span class="text-xs text-text-muted">{{ dimensions(entry) }}</span>
            </span>
        </button>
    }
    @if (decorEntries().length > 0) {
        <p class="font-black text-text-muted text-xs m-1 mt-3">DÉCOR</p>
        @for (entry of decorEntries(); track entry.type) {
            <button type="button" (pointerdown)="onDecorPointerDown(entry, $event)"
                class="flex flex-row items-center gap-2 rounded-lg px-2 py-1.5 text-left cursor-grab touch-none hover:bg-app">
                <span class="inline-block shrink-0 bg-chalk" [style.width.px]="20" [style.height.px]="entry.type === 'Wall' ? 4 : 12"></span>
                <span class="text-sm">{{ decorLabels[entry.type] }}</span>
            </button>
        }
    }
    <p class="text-xs text-text-muted m-1">Glissez un type sur le plan.</p>
</div>
