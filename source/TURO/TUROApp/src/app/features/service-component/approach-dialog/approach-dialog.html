<div class="fixed inset-0 z-40 flex items-center justify-center bg-slate/40" (pointerdown)="$event.stopPropagation()">
    <div role="dialog" aria-modal="true" class="flex w-96 flex-col gap-3 rounded-xl bg-surface p-4 text-text shadow-xl">
        <p class="text-lg font-bold">Placer {{ guest() }} sur {{ tablesLabel() }} ?</p>
        <p class="whitespace-pre-line text-sm">{{ message() }}</p>

        <div class="flex flex-col gap-1">
            <label class="text-sm font-bold">Nom de la table virtuelle</label>
            <div data-field="name"><app-input [formField]="fields.name" inputClass="w-full" /></div>
            @for (error of errorsOf('name'); track $index) { <p class="text-sm text-red-700">{{ error.message }}</p> }
        </div>
        <div class="flex flex-col gap-1">
            <label class="text-sm font-bold">Places une fois rapprochées</label>
            <div data-field="capacity"><app-number-input [formField]="fields.capacity" inputClass="w-full" /></div>
            @for (error of errorsOf('capacity'); track $index) { <p class="text-sm text-red-700">{{ error.message }}</p> }
            @for (error of errorsOf('members'); track $index) { <p class="text-sm text-red-700">{{ error.message }}</p> }
        </div>

        <div class="flex flex-row gap-2 *:flex-1">
            <app-button text="Annuler" type="Secondary" buttonClass="w-full h-11" (click)="cancelled.emit()" />
            <app-button text="Placer" buttonClass="w-full h-11" [disabled]="errors().length > 0" (click)="submit()" />
        </div>
    </div>
</div>
