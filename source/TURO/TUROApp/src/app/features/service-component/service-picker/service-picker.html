<div data-backdrop class="fixed inset-0 z-30" (click)="closed.emit()"></div>
<div class="absolute left-0 top-full mt-2 z-40 w-80 rounded-xl bg-surface shadow-2xl p-3 flex flex-col gap-3 text-text">
    <div class="flex flex-row items-center justify-between">
        <button type="button" data-month-prev aria-label="Mois précédent" class="size-8 rounded-md cursor-pointer hover:bg-app" (click)="turn(-1)">‹</button>
        <p class="font-bold capitalize">{{ monthLabel() }}</p>
        <button type="button" data-month-next aria-label="Mois suivant" class="size-8 rounded-md cursor-pointer hover:bg-app" (click)="turn(1)">›</button>
    </div>
    <div class="grid grid-cols-7 gap-1 text-center">
        @for (weekDay of weekDays; track $index) {
            <span class="text-xs font-bold text-text-muted">{{ weekDay }}</span>
        }
        @for (day of grid(); track day) {
            <button type="button" [attr.data-day]="day" [disabled]="!isOpen(day)" [class]="dayClass(day)" (click)="pickDay(day)">
                {{ +day.slice(8, 10) }}
                @if (isMarked(day)) {
                    <span data-dot class="absolute bottom-0.5 size-1 rounded-full bg-slate"></span>
                }
            </button>
        }
    </div>
    <div class="flex flex-col gap-1">
        <p class="text-sm font-bold capitalize">{{ dayLabel() }}</p>
        @for (window of windows(); track window.opening) {
            <button type="button" [attr.data-window]="window.opening.slice(0, 5)" (click)="pickWindow(window)"
                class="px-3 py-2 rounded-lg border-2 border-border-soft text-left text-sm cursor-pointer hover:bg-app">
                {{ windowLabel(window) }}
            </button>
        } @empty {
            <p class="text-sm text-text-muted">Aucun service ce jour-là.</p>
        }
    </div>
</div>
