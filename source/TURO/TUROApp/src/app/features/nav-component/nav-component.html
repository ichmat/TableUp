@if (authService.isConnected) {
<nav #mainNav (mouseenter)="openNavBar()" (mouseleave)="closeNavBar()" 
    class="absolute left-0 top-0
    flex flex-col gap-2 h-dvh px-1 py-2 text-xl border-r-2 bg-surface border-border text-text w-14 overflow-hidden
    transition-all duration-300 ease-in-out

    [&>a]:flex [&>a]:flex-row [&>a]:items-center [&>a]:gap-3 [&>a]:flex-nowrap [&>a]:hover:bg-app [&>a]:px-2 [&>a]:py-1
    [&>a]:rounded-xl ">
    <a routerLink="" routerLinkActive="bg-interactive text-surface" [routerLinkActiveOptions]="{ exact: true }">
        <hugeicons-icon
            [icon]="home"
            [size]="30"
            color="currentColor"
            [strokeWidth]="1.5"
            />
        Accueil
    </a>
    <a routerLink="service" routerLinkActive="bg-interactive text-surface">
        <hugeicons-icon
            [icon]="table"
            [size]="30"
            color="currentColor"
            [strokeWidth]="1.5"
            />
        Service
    </a>
    <a routerLink="reservation" routerLinkActive="bg-interactive text-surface">
        <hugeicons-icon
            [icon]="booking"
            [size]="30"
            color="currentColor"
            [strokeWidth]="1.5"
            />
        Reservations
    </a>
    <a routerLink="clients" routerLinkActive="bg-interactive text-surface">
        <hugeicons-icon
            [icon]="client"
            [size]="30"
            color="currentColor"
            [strokeWidth]="1.5"
            />
        Clients
    </a>

    <a #parameterNav routerLink="parametres" routerLinkActive="bg-interactive text-surface"
    class="absolute bottom-2 w-12 overflow-hidden left-1 
    transition-all duration-200">
        <hugeicons-icon
            [icon]="settings"
            [size]="30"
            color="currentColor"
            [strokeWidth]="1.5"
            />
        Paramètres
    </a>
</nav>
}
