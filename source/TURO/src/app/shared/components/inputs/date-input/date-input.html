<div [id]="randomId" [class]="wrapperClass()">
    <hugeicons-icon
        [icon]="calendar"
        [size]="24"
        color="currentColor"
        [strokeWidth]="1.5"
        class="cursor-pointer hover:brightness-125"
        (click)="displayPicker()"
        />

    <input
        #inputDay
        placeholder="--"
        max="31"
        min="1"
        type="number"
        class="w-6 text-center focus:bg-interactive"
        (change)="triggerChangeDateValue($event)"
        (focus)="selectAllOnFocus($event)"
        (keyup.enter)="inputMonth.focus()"
        />

    <p class="font-black -mx-1">/</p>

    <input
        #inputMonth
        placeholder="--"
        max="12"
        min="1"
        type="number"
        class="w-6 text-center focus:bg-interactive"
        (change)="triggerChangeDateValue($event)"
        (focus)="selectAllOnFocus($event)"
        (keyup.enter)="inputYear.focus()"
        />

    <p class="font-black -mx-1">/</p>

    <input
        #inputYear
        placeholder="----"
        [max]="maxYear"
        [min]="minYear"
        type="number"
        class="w-10 text-center focus:bg-interactive"
        (change)="triggerChangeDateValue($event)"
        (focus)="selectAllOnFocus($event)"
        (keyup.enter)="inputYear.blur()"
        />
</div>

<app-date-picker [idFor]="randomId" (validate)="pickerNewDate($event)" />
