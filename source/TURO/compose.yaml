# TURO — base de données, API et front
#
# Production (image unique, comme sur la box) :
#   docker compose --profile prod up --build
#   → http://localhost:8080
#
# Développement (rechargement à chaud du front et de l'API) :
#   docker compose --profile dev watch
#   → http://localhost:4200  (front, relaie /api vers l'API)
#   → http://localhost:5080  (API en direct)
#
# Base seule (API et front lancés depuis l'IDE) :
#   docker compose up -d
#   → Postgres sur localhost:5432

name: turo

x-api-env: &api-env
  ConnectionStrings__Turo: "Host=db;Port=5432;Database=${POSTGRES_DB:-turo};Username=${POSTGRES_USER:-turo};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant, copier .env.example vers .env}"

services:

  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-turo}
      POSTGRES_USER: ${POSTGRES_USER:-turo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant, copier .env.example vers .env}
    volumes:
      # Postgres 18+ : le volume se monte sur /var/lib/postgresql, pas sur .../data
      - db-data:/var/lib/postgresql
    ports:
      # Limité à la machine : jamais exposé sur le réseau du restaurant
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ─── Production ───────────────────────────────────────────────────
  turo:
    profiles: [prod]
    build:
      context: .
      target: final
    image: turo:local
    restart: unless-stopped
    environment:
      <<: *api-env
      ASPNETCORE_ENVIRONMENT: Production
    ports:
      - "${TURO_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

  # ─── Développement ────────────────────────────────────────────────
  api:
    profiles: [dev]
    build:
      context: .
      target: api-dev
    environment:
      <<: *api-env
    ports:
      - "${API_PORT:-5080}:8080"
    depends_on:
      db:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ./TUROAPI
          target: /src/TUROAPI
          ignore:
            - "**/bin/"
            - "**/obj/"
        - action: rebuild
          path: ./TUROAPI/TUROAPI/TUROAPI.csproj

  front:
    profiles: [dev]
    build:
      context: .
      target: front-dev
    environment:
      API_URL: http://api:8080
    ports:
      - "${FRONT_PORT:-4200}:4200"
    depends_on:
      - api
    develop:
      watch:
        - action: sync
          path: ./TUROApp
          target: /app
          ignore:
            - node_modules/
            - dist/
            - .angular/
        - action: rebuild
          path: ./TUROApp/package-lock.json

volumes:
  db-data:
